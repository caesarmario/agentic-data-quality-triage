<title id="erd-discord-workspaces-title">Discord / canonical workspaces</title>
<desc id="erd-discord-workspaces-desc">Workspaces, event history and investigation claims correlate on guild/incident. Thread uniqueness is partial (nonempty thread IDs), and single-active investigation uniqueness applies only to claimed/uncertain rows. No field-level FK is invented.</desc>
