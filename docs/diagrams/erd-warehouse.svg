<title id="erd-warehouse-title">Warehouse / dbt derivation</title>
<desc id="erd-warehouse-desc">Selected partition, event identity and metric fields. dbt staging filters synthetic test rows and computes net amount; the mart aggregates by date/country/channel. ORDER BY does not enforce uniqueness.</desc>
