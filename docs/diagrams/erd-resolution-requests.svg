<title id="erd-resolution-requests-title">Resolution / scoped revalidation</title>
<desc id="erd-resolution-requests-desc">A revalidation request belongs to one incident control; an idempotency key points to a durable request. Child-to-parent FK references use NO ACTION. Fresh PASS does not automatically close an incident.</desc>
