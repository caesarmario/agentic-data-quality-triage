<title id="erd-context-title">Triage / context and audit evidence</title>
<desc id="erd-context-desc">parent_run_id and alert identity correlate context with memory. Temporary context uses an expires_at deletion TTL; incident memory remains durable. Audit is append evidence, not an approval or recovery engine.</desc>
