<title id="erd-discord-delivery-title">Discord / incident delivery projection</title>
<desc id="erd-discord-delivery-desc">The message registry correlates to alerts through alert_key. transport/author_id are included after the idempotent bot-delivery ALTERs; legacy_webhook remains a historical default, not an active architecture recommendation.</desc>
