<text x="40" y="524" text-anchor="start" fill="#4c6558" font-family="Geist Mono, Consolas, monospace" font-size="11" font-weight="400">ORDER BY alert_key is not a UNIQUE constraint. Historical webhook values do not imply supported webhook delivery.</text>
