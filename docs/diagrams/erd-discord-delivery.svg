<text x="40" y="596" text-anchor="start" fill="#4c6558" font-family="Geist Mono, Consolas, monospace" font-size="11" font-weight="400">PK/FK: PostgreSQL constraints only. Solid gray FK: child N -&gt; parent 1; ON DELETE / UPDATE NO ACTION.</text>
