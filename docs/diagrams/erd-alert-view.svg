<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="erd-alert-view-title erd-alert-view-desc">
<title id="erd-alert-view-title">Alerts / a filtered read is not authority</title>
<desc id="erd-alert-view-desc">open_alerts inherits all 20 alert columns, but only selected lifecycle fields are shown. Its literal filter includes open/triaged, not acknowledged. No FK, UNIQUE or FINAL is introduced by the view.</desc>
<defs>
