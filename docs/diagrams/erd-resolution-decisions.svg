<title id="erd-resolution-decisions-title">Resolution / explicit closure decisions</title>
<desc id="erd-resolution-decisions-desc">The decision has two true FKs, one to the incident and one to its revalidation request. The diagram shows both. Application revision/scope/evidence gates add semantics that the FK constraints alone cannot enforce.</desc>
