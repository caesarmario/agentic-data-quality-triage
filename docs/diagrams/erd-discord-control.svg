<title id="erd-discord-control-title">Discord / claims and service identity</title>
<desc id="erd-discord-control-desc">These tables have independent PKs, not a declared relational parent-child chain. Copilot source_kind incorporates the command migration; service messages currently constrain kind to welcome. Physical BIGINT/TEXT identifier differences are preserved.</desc>
