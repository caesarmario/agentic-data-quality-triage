<marker id="architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#356851"/></marker>
</defs>
<rect x="0" y="0" width="1360" height="1080" rx="0" fill="#f7f8f2" stroke="none"/>
<text x="40" y="40" text-anchor="start" fill="#22734b" font-family="Geist Mono, Consolas, monospace" font-size="11" font-weight="500">DATASENTRY / REPOSITORY CONTRACT</text>
<text x="40" y="84" text-anchor="start" fill="#18382a" font-family="Instrument Serif, Georgia, serif" font-size="36" font-weight="400">Data reliability, with explicit boundaries</text>
<text x="40" y="116" text-anchor="start" fill="#4c6558" font-family="Geist, Trebuchet MS, sans-serif" font-size="14" font-weight="400">Deterministic data movement. Bounded investigation. Human-owned operational decisions.</text>
