<text x="40" y="168" text-anchor="start" fill="#22734b" font-family="Geist Mono, Consolas, monospace" font-size="11" font-weight="500">01 / DETERMINISTIC DATA PLANE / AIRFLOW ORCHESTRATION</text>
<rect x="24" y="376" width="1312" height="324" rx="8" fill="#edf1e8" stroke="#c1cfbe" stroke-dasharray="4 4"/>
<text x="40" y="400" text-anchor="start" fill="#22734b" font-family="Geist Mono, Consolas, monospace" font-size="11" font-weight="500">02 / SHARED SERVICES + BOUNDED INVESTIGATION</text>
<rect x="24" y="728" width="1312" height="244" rx="8" fill="#edf1e8" stroke="#c1cfbe" stroke-dasharray="4 4"/>
<text x="40" y="752" text-anchor="start" fill="#22734b" font-family="Geist Mono, Consolas, monospace" font-size="11" font-weight="500">03 / INDEPENDENT HUMAN AND OPERATIONAL GATES</text>
