<rect x="48" y="192" width="264" height="124" rx="8" fill="#fdfef9" stroke="#c1cfbe"/>
<text x="64" y="216" text-anchor="start" fill="#22734b" font-family="Geist Mono, Consolas, monospace" font-size="11" font-weight="500">PYTHON / SYNTHETIC INPUT</text>
<text x="64" y="244" text-anchor="start" fill="#18382a" font-family="Geist, Trebuchet MS, sans-serif" font-size="18" font-weight="600">Generate orders</text>
<text x="64" y="268" text-anchor="start" fill="#4c6558" font-family="Geist, Trebuchet MS, sans-serif" font-size="14" font-weight="400">Seeded dates and scenarios</text>
<text x="64" y="288" text-anchor="start" fill="#4c6558" font-family="Geist, Trebuchet MS, sans-serif" font-size="14" font-weight="400">Not an external source connector</text>
<rect x="368" y="192" width="272" height="124" rx="8" fill="#fdfef9" stroke="#c1cfbe"/>
<text x="384" y="216" text-anchor="start" fill="#22734b" font-family="Geist Mono, Consolas, monospace" font-size="11" font-weight="500">SEAWEEDFS / S3</text>
<text x="384" y="244" text-anchor="start" fill="#18382a" font-family="Geist, Trebuchet MS, sans-serif" font-size="18" font-weight="600">Land and retain</text>
<text x="384" y="268" text-anchor="start" fill="#4c6558" font-family="Geist, Trebuchet MS, sans-serif" font-size="14" font-weight="400">Parquet landing partitions</text>
<text x="384" y="288" text-anchor="start" fill="#4c6558" font-family="Geist, Trebuchet MS, sans-serif" font-size="14" font-weight="400">Reports / dbt artifacts / evidence</text>
<rect x="696" y="192" width="272" height="124" rx="8" fill="#fdfef9" stroke="#c1cfbe"/>
<text x="712" y="216" text-anchor="start" fill="#22734b" font-family="Geist Mono, Consolas, monospace" font-size="11" font-weight="500">CLICKHOUSE + DBT</text>
<text x="712" y="244" text-anchor="start" fill="#18382a" font-family="Geist, Trebuchet MS, sans-serif" font-size="18" font-weight="600">Load and transform</text>
<text x="712" y="268" text-anchor="start" fill="#4c6558" font-family="Geist, Trebuchet MS, sans-serif" font-size="14" font-weight="400">raw -&gt; staging -&gt; daily mart</text>
<text x="712" y="288" text-anchor="start" fill="#4c6558" font-family="Geist, Trebuchet MS, sans-serif" font-size="14" font-weight="400">Bounded partition reruns</text>
<rect x="1024" y="192" width="288" height="124" rx="8" fill="#fdfef9" stroke="#c1cfbe"/>
<text x="1040" y="216" text-anchor="start" fill="#22734b" font-family="Geist Mono, Consolas, monospace" font-size="11" font-weight="500">DETERMINISTIC CHECKS</text>
<text x="1040" y="244" text-anchor="start" fill="#18382a" font-family="Geist, Trebuchet MS, sans-serif" font-size="18" font-weight="600">Detect and record</text>
<text x="1040" y="268" text-anchor="start" fill="#4c6558" font-family="Geist, Trebuchet MS, sans-serif" font-size="14" font-weight="400">DQ / profiling / schema drift</text>
<text x="1040" y="288" text-anchor="start" fill="#4c6558" font-family="Geist, Trebuchet MS, sans-serif" font-size="14" font-weight="400">ClickHouse alerts + audit evidence</text>
<rect x="48" y="424" width="264" height="124" rx="8" fill="#fdfef9" stroke="#c1cfbe"/>
<text x="64" y="448" text-anchor="start" fill="#22734b" font-family="Geist Mono, Consolas, monospace" font-size="11" font-weight="500">OPERATOR CLIENTS</text>
<text x="64" y="476" text-anchor="start" fill="#18382a" font-family="Geist, Trebuchet MS, sans-serif" font-size="18" font-weight="600">UI and Discord</text>
<text x="64" y="500" text-anchor="start" fill="#4c6558" font-family="Geist, Trebuchet MS, sans-serif" font-size="14" font-weight="400">Streamlit / optional web UI</text>
<text x="64" y="520" text-anchor="start" fill="#4c6558" font-family="Geist, Trebuchet MS, sans-serif" font-size="14" font-weight="400">Discord uses the shared API</text>
<rect x="368" y="424" width="272" height="124" rx="8" fill="#e3efdf" stroke="#22734b"/>
<text x="384" y="448" text-anchor="start" fill="#22734b" font-family="Geist Mono, Consolas, monospace" font-size="11" font-weight="500">FASTAPI + SHARED SERVICES</text>
<text x="384" y="476" text-anchor="start" fill="#18382a" font-family="Geist, Trebuchet MS, sans-serif" font-size="18" font-weight="600">One control surface</text>
<text x="384" y="500" text-anchor="start" fill="#4c6558" font-family="Geist, Trebuchet MS, sans-serif" font-size="14" font-weight="400">Evidence / Copilot / triage</text>
<text x="384" y="520" text-anchor="start" fill="#4c6558" font-family="Geist, Trebuchet MS, sans-serif" font-size="14" font-weight="400">Authorized approval + Resolve</text>
<rect x="696" y="424" width="272" height="124" rx="8" fill="#fdfef9" stroke="#c1cfbe"/>
<text x="712" y="448" text-anchor="start" fill="#22734b" font-family="Geist Mono, Consolas, monospace" font-size="11" font-weight="500">BOUNDED LANGGRAPH</text>
<text x="712" y="476" text-anchor="start" fill="#18382a" font-family="Geist, Trebuchet MS, sans-serif" font-size="18" font-weight="600">Investigate and explain</text>
<text x="712" y="500" text-anchor="start" fill="#4c6558" font-family="Geist, Trebuchet MS, sans-serif" font-size="14" font-weight="400">Policy-owned evidence loops</text>
<text x="712" y="520" text-anchor="start" fill="#4c6558" font-family="Geist, Trebuchet MS, sans-serif" font-size="14" font-weight="400">Reports, not direct repair</text>
<rect x="1024" y="424" width="288" height="124" rx="8" fill="#fdfef9" stroke="#c1cfbe"/>
<text x="1040" y="448" text-anchor="start" fill="#22734b" font-family="Geist Mono, Consolas, monospace" font-size="11" font-weight="500">OPTIONAL / ROUTED LLM</text>
<text x="1040" y="476" text-anchor="start" fill="#18382a" font-family="Geist, Trebuchet MS, sans-serif" font-size="18" font-weight="600">Narrative support</text>
<text x="1040" y="500" text-anchor="start" fill="#4c6558" font-family="Geist, Trebuchet MS, sans-serif" font-size="14" font-weight="400">Explicit enablement + budgets</text>
<text x="1040" y="520" text-anchor="start" fill="#4c6558" font-family="Geist, Trebuchet MS, sans-serif" font-size="14" font-weight="400">Heuristic / no-LLM fallback</text>
<rect x="368" y="588" width="272" height="84" rx="8" fill="#fdfef9" stroke="#c1cfbe"/>
<text x="384" y="612" text-anchor="start" fill="#22734b" font-family="Geist Mono, Consolas, monospace" font-size="11" font-weight="500">MCP / STDIO ADAPTER</text>
<text x="384" y="640" text-anchor="start" fill="#18382a" font-family="Geist, Trebuchet MS, sans-serif" font-size="18" font-weight="600">Direct tool sharing</text>
<rect x="696" y="588" width="272" height="84" rx="8" fill="#fdfef9" stroke="#c1cfbe"/>
<text x="712" y="612" text-anchor="start" fill="#22734b" font-family="Geist Mono, Consolas, monospace" font-size="11" font-weight="500">SHARED GUARDED TOOLS</text>
<text x="712" y="640" text-anchor="start" fill="#18382a" font-family="Geist, Trebuchet MS, sans-serif" font-size="18" font-weight="600">Read bounded evidence</text>
<rect x="48" y="780" width="360" height="156" rx="8" fill="#fdfef9" stroke="#c1cfbe"/>
<text x="64" y="804" text-anchor="start" fill="#22734b" font-family="Geist Mono, Consolas, monospace" font-size="11" font-weight="500">GATE A / HUMAN APPROVAL</text>
<text x="64" y="832" text-anchor="start" fill="#18382a" font-family="Geist, Trebuchet MS, sans-serif" font-size="18" font-weight="600">Authorize exact scope</text>
<text x="64" y="856" text-anchor="start" fill="#4c6558" font-family="Geist, Trebuchet MS, sans-serif" font-size="14" font-weight="400">Legacy ClickHouse backfill approvals</text>
<text x="64" y="876" text-anchor="start" fill="#4c6558" font-family="Geist, Trebuchet MS, sans-serif" font-size="14" font-weight="400">PostgreSQL approved-action control</text>
<text x="64" y="896" text-anchor="start" fill="#4c6558" font-family="Geist, Trebuchet MS, sans-serif" font-size="14" font-weight="400">A decision does not execute work.</text>
<rect x="488" y="780" width="360" height="156" rx="8" fill="#fdfef9" stroke="#c1cfbe"/>
<text x="504" y="804" text-anchor="start" fill="#22734b" font-family="Geist Mono, Consolas, monospace" font-size="11" font-weight="500">GATE B / AIRFLOW EXECUTION</text>
<text x="504" y="832" text-anchor="start" fill="#18382a" font-family="Geist, Trebuchet MS, sans-serif" font-size="18" font-weight="600">Dispatch approved work</text>
<text x="504" y="856" text-anchor="start" fill="#4c6558" font-family="Geist, Trebuchet MS, sans-serif" font-size="14" font-weight="400">Backfill / allowlisted action DAGs</text>
<text x="504" y="876" text-anchor="start" fill="#4c6558" font-family="Geist, Trebuchet MS, sans-serif" font-size="14" font-weight="400">Claims + idempotency + audit</text>
<text x="504" y="896" text-anchor="start" fill="#4c6558" font-family="Geist, Trebuchet MS, sans-serif" font-size="14" font-weight="400">Success does not resolve an incident.</text>
<rect x="928" y="780" width="384" height="156" rx="8" fill="#fdfef9" stroke="#c1cfbe"/>
<text x="944" y="804" text-anchor="start" fill="#22734b" font-family="Geist Mono, Consolas, monospace" font-size="11" font-weight="500">GATE C / RECHECK + HUMAN RESOLVE</text>
<text x="944" y="832" text-anchor="start" fill="#18382a" font-family="Geist, Trebuchet MS, sans-serif" font-size="18" font-weight="600">Confirm evidence, then close</text>
<text x="944" y="856" text-anchor="start" fill="#4c6558" font-family="Geist, Trebuchet MS, sans-serif" font-size="14" font-weight="400">Separate scoped revalidation DAG</text>
<text x="944" y="876" text-anchor="start" fill="#4c6558" font-family="Geist, Trebuchet MS, sans-serif" font-size="14" font-weight="400">Fresh PASS + operator confirmation</text>
<text x="944" y="896" text-anchor="start" fill="#4c6558" font-family="Geist, Trebuchet MS, sans-serif" font-size="14" font-weight="400">PostgreSQL state + sink outbox</text>
<text x="48" y="568" text-anchor="start" fill="#4c6558" font-family="Geist Mono, Consolas, monospace" font-size="11" font-weight="400">MCP is not routed through FastAPI.</text>
<text x="1024" y="592" text-anchor="start" fill="#4c6558" font-family="Geist Mono, Consolas, monospace" font-size="11" font-weight="400">Evidence reads only;</text>
<text x="1024" y="612" text-anchor="start" fill="#4c6558" font-family="Geist Mono, Consolas, monospace" font-size="11" font-weight="400">no LLM SQL execution.</text>
<text x="928" y="956" text-anchor="start" fill="#4c6558" font-family="Geist Mono, Consolas, monospace" font-size="11" font-weight="400">Resolve never repairs data.</text>
<text x="40" y="996" text-anchor="start" fill="#4c6558" font-family="Geist Mono, Consolas, monospace" font-size="11" font-weight="400">Airflow internals, Redis/Celery, optional SQLite checkpoints and individual tool nodes are intentionally omitted.</text>
<path d="M40 1012 H1320" stroke="#c1cfbe"/>
<text x="40" y="1036" text-anchor="start" fill="#4c6558" font-family="Geist Mono, Consolas, monospace" font-size="11" font-weight="400">Solid: implemented calls / data movement. Dashed: evidence correlation or optional model route. No autonomous repair loop.</text>
<text x="40" y="1056" text-anchor="start" fill="#4c6558" font-family="Geist Mono, Consolas, monospace" font-size="11" font-weight="400">Implementation map, not live acceptance. Approval, execution, revalidation and human closure remain separate.</text>
</svg>
