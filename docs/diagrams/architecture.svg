<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1080" viewBox="0 0 1360 1080" role="img" aria-labelledby="architecture-title architecture-desc">
<title id="architecture-title">Data reliability, with explicit boundaries</title>
<desc id="architecture-desc">Airflow orchestrates synthetic orders through SeaweedFS, ClickHouse, dbt and deterministic checks. API clients and a direct MCP adapter share guarded tools with bounded LangGraph investigation. Human approval, operational execution and evidence-gated Resolve are separate boundaries, not autonomous repair.</desc>
<defs>
<marker id="architecture-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#4c6558"/></marker>
