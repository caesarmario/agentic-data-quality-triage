<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="erd-resolution-outbox-title erd-resolution-outbox-desc">
<title id="erd-resolution-outbox-title">Resolution / independent sink delivery</title>
<desc id="erd-resolution-outbox-desc">incident_outbox references the incident control with one true FK. The unique event tuple prevents duplicate logical events. Projection/audit/delivery flags track separate sinks; there is no atomic cross-store transaction or blanket exactly-once guarantee.</desc>
<defs>
<marker id="erd-resolution-outbox-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#4c6558"/></marker>
<marker id="erd-resolution-outbox-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#22734b"/></marker>
<marker id="erd-resolution-outbox-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#356851"/></marker>
</defs>
<rect x="0" y="0" width="1280" height="640" rx="0" fill="#f7f8f2" stroke="none"/>
<text x="40" y="40" text-anchor="start" fill="#22734b" font-family="Geist Mono, Consolas, monospace" font-size="11" font-weight="500">DATASENTRY / REPOSITORY CONTRACT</text>
<text x="40" y="84" text-anchor="start" fill="#18382a" font-family="Instrument Serif, Georgia, serif" font-size="36" font-weight="400">Resolution / independent sink delivery</text>
<text x="40" y="120" text-anchor="start" fill="#4c6558" font-family="Geist, Trebuchet MS, sans-serif" font-size="14" font-weight="400">A committed incident decision is separate from projection, audit and Discord delivery.</text>
