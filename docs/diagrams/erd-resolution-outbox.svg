<text x="40" y="524" text-anchor="start" fill="#4c6558" font-family="Geist Mono, Consolas, monospace" font-size="11" font-weight="400">UNIQUE(alert_key, revision, event_type). Sink failures remain pending; successful closure is not delivery success.</text>
<path d="M40 572 H1240" stroke="#c1cfbe"/>
<text x="40" y="596" text-anchor="start" fill="#4c6558" font-family="Geist Mono, Consolas, monospace" font-size="11" font-weight="400">PK/FK: PostgreSQL constraints only. Solid gray FK: child N -&gt; parent 1; ON DELETE / UPDATE NO ACTION.</text>
<text x="40" y="616" text-anchor="start" fill="#4c6558" font-family="Geist Mono, Consolas, monospace" font-size="11" font-weight="400">Dashed gray: logical only. Solid blue: dbt derivation. Selected columns; full types and all omitted fields in data-model.md.</text>
