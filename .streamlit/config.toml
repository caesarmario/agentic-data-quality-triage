# --- Configuring Browser Behavior
[browser]
gatherUsageStats = false


# --- Configuring Theme Settings Shared By Both Modes
[theme]
showSidebarBorder = true
baseFontSize = 16
baseFontWeight = 400


# --- Configuring The Light Theme
[theme.light]
primaryColor = "#0B6B5B"
backgroundColor = "#F6F8F5"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#18211B"
linkColor = "#075E50"
codeTextColor = "#23352C"
codeBackgroundColor = "#EAF0EC"
borderColor = "#CBD5CE"
showWidgetBorder = true
baseRadius = "12px"
buttonRadius = "10px"
font = "Aptos"
headingFont = "Bahnschrift"
codeFont = "Cascadia Mono"
headingFontSizes = ["2.45rem", "1.85rem", "1.45rem", "1.16rem", "1rem", "0.9rem"]
headingFontWeights = [650, 650, 600, 600, 600, 600]
linkUnderline = false

redColor = "#B9382E"
redBackgroundColor = "#FBE9E7"
redTextColor = "#84261F"
orangeColor = "#A45114"
orangeBackgroundColor = "#FCECDD"
orangeTextColor = "#713608"
yellowColor = "#8C6800"
yellowBackgroundColor = "#FFF4CC"
yellowTextColor = "#604700"
greenColor = "#1B6E4B"
greenBackgroundColor = "#E5F5EC"
greenTextColor = "#14543B"
blueColor = "#2B5CA8"
blueBackgroundColor = "#E8EFFB"
blueTextColor = "#1F477F"
violetColor = "#7356A8"
violetBackgroundColor = "#F0EBF8"
violetTextColor = "#503B78"
grayColor = "#58645C"
grayBackgroundColor = "#EDF1EE"
grayTextColor = "#3F4942"

dataframeBorderColor = "#CBD5CE"
dataframeHeaderBackgroundColor = "#EAF0EC"


# --- Configuring The Light Sidebar
[theme.light.sidebar]
backgroundColor = "#EEF3EF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#18211B"
primaryColor = "#0B6B5B"
borderColor = "#CBD5CE"
codeBackgroundColor = "#E2EAE5"


# --- Configuring The Dark Theme
