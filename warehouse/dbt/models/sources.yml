# --- Defining Configuration

version: 2

sources:
  - name: raw
    description: Raw event-level data loaded from SeaweedFS S3 landing into ClickHouse.
    schema: "{{ env_var('CLICKHOUSE_DB', 'dq') }}"

    tables:
      - name: raw_orders
        description: Event-level order records loaded idempotently by dt partition.
        columns:
          - name: dt
            description: Business date partition.
          - name: order_id
            description: Deterministic synthetic order identifier.
          - name: country
            description: Country segment code.
          - name: channel
            description: Marketing or order acquisition channel.
          - name: status
            description: Order lifecycle status.
          - name: ingestion_ts
            description: Timestamp when the event became available for ingestion.

