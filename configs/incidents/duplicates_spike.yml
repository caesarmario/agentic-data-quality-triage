# --- Defining Scenario Metadata
scenario_id: duplicates_spike
dataset: orders
enabled: true
incident_scenario: duplicates_spike
description: Duplicate a deterministic sample of order events for the requested partition.

# --- Defining Ground Truth Labels
ground_truth:
  root_cause_category: duplicate_ingestion
  expected_alert: true
  expected_dq_signals:
    - table_name: dq.fct_orders_daily
      check_name: duplicate_rate__daily_total
      severity: critical
  expected_agent_summary: Duplicate order IDs increased above the accepted daily rate threshold.

# --- Defining Expected Pipeline Behavior
expected_pipeline_behavior:
  seed_to_s3: success
  load_to_clickhouse: success
  dbt_transform: success
  dq_checks: critical_failure_expected
  triage_required: true

# --- Defining Demo Execution Defaults
demo:
  airflow_conf:
    dt: "2026-05-04"
    incident_scenario: duplicates_spike
  make_command: make seed DT=2026-05-04 INCIDENT_SCENARIO=duplicates_spike
