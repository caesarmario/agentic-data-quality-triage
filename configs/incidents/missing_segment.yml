# --- Defining Scenario Metadata
scenario_id: missing_segment
dataset: orders
enabled: true
incident_scenario: missing_segment
description: Remove one country-channel segment from the requested orders partition.

# --- Defining Ground Truth Labels
ground_truth:
  root_cause_category: segment_drop
  expected_alert: true
  expected_dq_signals:
    - table_name: dq.fct_orders_daily
      check_name: segment_coverage__country_channel
      severity: warning
  expected_agent_summary: One expected country-channel segment is absent from the daily mart.

# --- Defining Expected Pipeline Behavior
expected_pipeline_behavior:
  seed_to_s3: success
  load_to_clickhouse: success
  dbt_transform: success
  dq_checks: warning_expected
  triage_required: true

# --- Defining Demo Execution Defaults
demo:
  airflow_conf:
    dt: "2026-05-04"
    incident_scenario: missing_segment
  make_command: make seed DT=2026-05-04 INCIDENT_SCENARIO=missing_segment
