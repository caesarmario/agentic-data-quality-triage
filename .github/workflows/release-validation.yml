name: Release validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXTERNAL_LLM_ENABLED: "false"
      COPILOT_EXTERNAL_LLM_ENABLED: "false"
      INCIDENT_CONTROL_ENABLED: "false"
      DQ_CONTROL_DATABASE_URL: ""
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Initialize sanitized report directory
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release-validation"
          printf '{"schema_version":1,"workflow":"release-validation","status":"started"}\n' \
            > "$RUNNER_TEMP/release-validation/run.json"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: infra/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            tools/demo-video/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r infra/requirements.txt

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Install demo-video dependencies
        working-directory: tools/demo-video
        run: npm ci --no-audit --no-fund

      - name: Check generated diagrams without writing
        run: python scripts/build_repository_diagrams.py --check

      - name: Validate public documentation bundle
        run: python scripts/validate_repository_presentation.py

      - name: Run web package checks
        working-directory: apps/web
        run: |
          npm test
          npm run typecheck

      - name: Run frozen demo-video source checks
        working-directory: tools/demo-video
        run: npm run check

      - name: Run full Python suite and gate sanitized JUnit results
        shell: bash
        run: |
          set +e
          python -m pytest -ra tests --junitxml="$RUNNER_TEMP/release-validation-junit.xml" \
            > "$RUNNER_TEMP/release-validation-pytest.log" 2>&1
          pytest_exit_code=$?
          set -e
          python scripts/check_ci_test_results.py \
            "$RUNNER_TEMP/release-validation-junit.xml" \
            --output "$RUNNER_TEMP/release-validation/test-results.json" \
            --pytest-log "$RUNNER_TEMP/release-validation-pytest.log" \
            --pytest-exit-code "$pytest_exit_code"

      - name: Upload sanitized validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-validation-report
          path: |
            ${{ runner.temp }}/release-validation/run.json
            ${{ runner.temp }}/release-validation/test-results.json
          if-no-files-found: warn
          retention-days: 14
